<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Light Skin Black Man Skin Tone -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d89e67" />
      <stop offset="100%" stop-color="#b87b46" />
    </linearGradient>

    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Circular Backdrop with Gradient and Tech Pattern -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="185" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3" />

  <!-- Subtle Ambient Tech Circles -->
  <circle cx="70" cy="90" r="4" fill="#ffffff" opacity="0.4" />
  <circle cx="330" cy="110" r="6" fill="#38bdf8" opacity="0.5" />
  <circle cx="60" cy="280" r="5" fill="#a78bfa" opacity="0.5" />
  <circle cx="340" cy="290" r="4" fill="#ffffff" opacity="0.4" />

  <!-- Code Symbol Floating -->
  <g opacity="0.25">
    <text x="50" y="160" font-family="monospace" font-size="28" font-weight="bold" fill="#ffffff">&lt;/&gt;</text>
    <text x="310" y="210" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff">{ ; }</text>
  </g>

  <!-- Body / Hoodie -->
  <path d="M 90,390 C 90,310 140,285 200,285 C 260,285 310,310 310,390 Z" fill="url(#hoodieGrad)" />
  <!-- Inner T-Shirt / Collar -->
  <path d="M 170,285 C 170,325 230,325 230,285 Z" fill="url(#shirtGrad)" />
  <!-- Hoodie Strings -->
  <path d="M 180,295 Q 178,340 176,350" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 220,295 Q 222,340 224,350" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Neck -->
  <rect x="180" y="230" width="40" height="60" rx="8" fill="url(#skinGrad)" />

  <!-- Head Base -->
  <ellipse cx="200" cy="180" rx="60" ry="72" fill="url(#skinGrad)" />

  <!-- Modern Hair -->
  <path d="M 138,170 C 135,110 160,88 200,88 C 240,88 265,110 262,170 C 255,125 240,112 200,112 C 160,112 145,125 138,170 Z" fill="#171717" />
  <circle cx="150" cy="115" r="14" fill="#171717" />
  <circle cx="175" cy="98" r="16" fill="#171717" />
  <circle cx="205" cy="95" r="16" fill="#171717" />
  <circle cx="230" cy="102" r="15" fill="#171717" />
  <circle cx="250" cy="120" r="14" fill="#171717" />

  <!-- Ears -->
  <circle cx="138" cy="182" r="12" fill="#be804a" />
  <circle cx="262" cy="182" r="12" fill="#be804a" />

  <!-- Modern Glasses -->
  <rect x="152" y="162" width="38" height="28" rx="8" fill="none" stroke="#ffffff" stroke-width="3.5" />
  <rect x="210" y="162" width="38" height="28" rx="8" fill="none" stroke="#ffffff" stroke-width="3.5" />
  <line x1="190" y1="174" x2="210" y2="174" stroke="#ffffff" stroke-width="3.5" />
  <line x1="140" y1="172" x2="152" y2="172" stroke="#ffffff" stroke-width="3.5" />
  <line x1="248" y1="172" x2="260" y2="172" stroke="#ffffff" stroke-width="3.5" />

  <!-- Eyes behind glasses -->
  <ellipse cx="171" cy="176" rx="4.5" ry="5.5" fill="#ffffff" />
  <circle cx="171" cy="176" r="3" fill="#171717" />
  <ellipse cx="229" cy="176" rx="4.5" ry="5.5" fill="#ffffff" />
  <circle cx="229" cy="176" r="3" fill="#171717" />

  <!-- Friendly Eyebrows -->
  <path d="M 156,154 Q 170,148 184,154" stroke="#171717" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <path d="M 216,154 Q 230,148 244,154" stroke="#171717" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Nose -->
  <path d="M 200,180 L 196,196 L 204,196" stroke="#854f24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Warm Smile -->
  <path d="M 184,212 Q 200,226 216,212" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Modern Floating Developer Badge at Bottom Right -->
  <g transform="translate(250, 275)" filter="url(#softGlow)">
    <rect width="110" height="36" rx="18" fill="#ffffff" />
    <circle cx="20" cy="18" r="8" fill="#10b981" />
    <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0f172a">COS 106</text>
  </g>
</svg>
